<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cadastro — Nexa Cord</title>
<link rel="stylesheet" href="auth-styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="glass-card">
    <div class="brand">Nexa Cord</div>
    <p class="subtitle">Crie sua conta</p>

    <div id="msgBox" class="msg"></div>

    <form id="signupForm">
      <div>
        <label for="username">Nome de usuário</label>
        <input type="text" id="username" required minlength="3" maxlength="20">
      </div>
      <div>
        <label for="email">E-mail</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div>
        <label for="password">Senha</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="primary" id="signupBtn">Criar conta</button>
    </form>

    <p class="switch-link">Já tem conta? <a href="login.html">Entrar</a></p>
  </div>

  <script src="supabaseClient.js"></script>
  <script>
    const form = document.getElementById("signupForm");
    const msgBox = document.getElementById("msgBox");
    const btn = document.getElementById("signupBtn");

    function showMsg(text, type) {
      msgBox.textContent = text;
      msgBox.className = "msg " + type;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = "Criando conta...";

      const username = document.getElementById("username").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      // username vai em user_metadata; o trigger no banco copia pra tabela profiles
      const { data, error } = await client.auth.signUp({
        email,
        password,
        options: { data: { username } }
      });

      if (error) {
        showMsg(error.message, "error");
        btn.disabled = false;
        btn.textContent = "Criar conta";
        return;
      }

      // Se confirmação de e-mail estiver ativa no Supabase, session vem null aqui
      if (!data.session) {
        showMsg("Conta criada! Verifique seu e-mail para confirmar antes de entrar.", "success");
        btn.textContent = "Conta criada";
        return;
      }

      window.location.href = "chat.html";
    });
  </script>
</body>
</html>
