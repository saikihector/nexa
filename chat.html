<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat — Saiki Chat</title>
<link rel="stylesheet" href="auth-styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { align-items: stretch; padding: 0; }

  .chat-shell {
    width: 100%;
    max-width: 720px;
    height: 88vh;
    margin: auto;
    display: flex;
    flex-direction: column;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    overflow: hidden;
  }

  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid var(--glass-border);
  }

  .chat-header .brand { font-size: 1.3rem; margin: 0; }

  #logoutBtn {
    background: none;
    border: 1px solid var(--glass-border);
    color: var(--text-dim);
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.82rem;
  }
  #logoutBtn:hover { color: var(--text); border-color: var(--accent); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .message { max-width: 78%; }
  .message.own { align-self: flex-end; text-align: right; }

  .message .meta {
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-bottom: 3px;
  }

  .message .bubble {
    display: inline-block;
    padding: 9px 14px;
    border-radius: 14px;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--glass-border);
    font-size: 0.9rem;
    line-height: 1.4;
    word-break: break-word;
  }

  .message.own .bubble {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border: none;
    color: #fff;
  }

  #chatForm {
    display: flex;
    gap: 10px;
    padding: 16px 20px;
    border-top: 1px solid var(--glass-border);
  }

  #messageInput {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.05);
    color: var(--text);
    outline: none;
  }
  #messageInput:focus { border-color: var(--accent); }

  #sendBtn {
    padding: 0 20px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }
  #sendBtn:hover { opacity: 0.9; }
</style>
</head>
<body>
  <div class="chat-shell">
    <div class="chat-header">
      <p class="brand">Nexa Cord</p>
      <button id="logoutBtn">Sair</button>
    </div>

    <div id="messages"></div>

    <form id="chatForm">
      <input type="text" id="messageInput" placeholder="Escreva uma mensagem..." maxlength="500" autocomplete="off" required>
      <button type="submit" id="sendBtn">Enviar</button>
    </form>
  </div>

  <script src="supabaseClient.js"></script>
  <script>
    let currentUser = null;
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");

    function renderMessage(msg) {
      const isOwn = msg.user_id === currentUser.id;
      const div = document.createElement("div");
      div.className = "message" + (isOwn ? " own" : "");
      const time = new Date(msg.created_at).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
      div.innerHTML = `
        <div class="meta">${isOwn ? "Você" : escapeHtml(msg.username)} · ${time}</div>
        <div class="bubble">${escapeHtml(msg.content)}</div>
      `;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    async function init() {
      const session = await requireAuth();
      if (!session) return;
      currentUser = session.user;

      // Carrega histórico (últimas 50 mensagens)
      const { data: history, error } = await client
        .from("messages")
        .select("*")
        .order("created_at", { ascending: true })
        .limit(50);

      if (!error && history) history.forEach(renderMessage);

      // Assina novas mensagens em tempo real
      client
        .channel("public:messages")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, (payload) => {
          renderMessage(payload.new);
        })
        .subscribe();
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const content = input.value.trim();
      if (!content) return;

      const username = currentUser.user_metadata?.username || currentUser.email.split("@")[0];

      const { error } = await client.from("messages").insert({
        user_id: currentUser.id,
        username,
        content
      });

      if (!error) input.value = "";
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await client.auth.signOut();
      window.location.href = "login.html";
    });

    init();
  </script>
</body>
</html>
