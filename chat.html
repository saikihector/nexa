<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chat — Nexa Cord</title>
<link rel="stylesheet" href="auth-styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { align-items: stretch; padding: 0; }

  .chat-shell {
    width: 100%;
    max-width: 720px;
    height: 88vh;
    height: 88dvh;
    margin: auto;
    display: flex;
    flex-direction: column;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 18px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.35);
    overflow: hidden;
  }

  @media (max-width: 768px) {
    .chat-shell {
      max-width: 100%;
      height: 100vh;
      height: 100dvh;
      border-radius: 0;
      border-left: none;
      border-right: none;
      box-shadow: none;
    }
  }

  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    border-bottom: 1px solid var(--glass-border);
    flex-shrink: 0;
  }

  @media (max-width: 420px) {
    .chat-header { padding: 14px 16px; }
    #profileLink span.full-label { display: none; }
  }

  .chat-header .brand { font-size: 1.3rem; margin: 0; }

  #logoutBtn {
    background: none;
    border: 1px solid var(--glass-border);
    color: var(--text-dim);
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.82rem;
  }
  #logoutBtn:hover { color: var(--text); border-color: var(--accent); }

  .header-actions { display: flex; gap: 10px; align-items: center; }

  #profileLink {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.82rem;
    border: 1px solid var(--glass-border);
    padding: 7px 14px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #profileLink:hover { color: var(--text); border-color: var(--accent); }

  #messages {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  @media (max-width: 420px) {
    #messages { padding: 14px 16px; }
  }

  .message { max-width: 78%; display: flex; gap: 10px; }
  .message.own { align-self: flex-end; flex-direction: row-reverse; text-align: right; }

  .msg-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    flex-shrink: 0;
    object-fit: cover;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Playfair Display', serif;
    font-size: 0.85rem;
    color: #fff;
  }

  .message .meta {
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-bottom: 3px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .message.own .meta { justify-content: flex-end; }

  .delete-btn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 2px;
    display: flex;
    align-items: center;
    opacity: 0.7;
  }
  .delete-btn:hover { color: var(--danger); opacity: 1; }

  .message .bubble {
    display: inline-block;
    padding: 9px 14px;
    border-radius: 14px;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--glass-border);
    font-size: 0.9rem;
    line-height: 1.4;
    word-break: break-word;
  }

  .message.own .bubble {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border: none;
    color: #fff;
  }

  .bubble img.media, .bubble video.media {
    display: block;
    width: 100%;
    max-width: min(240px, 60vw);
    max-height: 240px;
    height: auto;
    border-radius: 10px;
    margin-bottom: 6px;
  }

  .bubble .bubble-text { }

  #attachPreview {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 20px 0;
  }

  #attachPreview.visible { display: flex; }

  #attachPreview .thumb {
    width: 48px;
    height: 48px;
    border-radius: 8px;
    object-fit: cover;
    border: 1px solid var(--glass-border);
  }

  #attachPreview .attach-name {
    font-size: 0.78rem;
    color: var(--text-dim);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #removeAttachBtn {
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    padding: 4px;
  }
  #removeAttachBtn:hover { color: var(--danger); }

  #chatForm {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 20px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--glass-border);
    flex-shrink: 0;
  }

  @media (max-width: 420px) {
    #chatForm { padding-left: 14px; padding-right: 14px; }
    #attachPreview { padding-left: 14px; padding-right: 14px; }
  }

  #fileInput { display: none; }

  #attachBtn {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.05);
    color: var(--text-dim);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #attachBtn:hover { color: var(--text); border-color: var(--accent); }

  #messageInput {
    flex: 1;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.05);
    color: var(--text);
    outline: none;
  }
  #messageInput:focus { border-color: var(--accent); }

  #sendBtn {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: #fff;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
  }
  #sendBtn.visible { display: flex; }
  #sendBtn:hover { opacity: 0.9; }

  @media (max-width: 420px) {
    #attachBtn, #sendBtn { width: 44px; height: 44px; }
  }
</style>
</head>
<body>
  <div class="chat-shell">
    <div class="chat-header">
      <p class="brand">Nexa Cord</p>
      <div class="header-actions">
        <a id="profileLink" href="perfil.html">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
          <span class="full-label">Meu perfil</span>
        </a>
        <button id="logoutBtn">Sair</button>
      </div>
    </div>

    <div id="messages"></div>

    <div id="attachPreview">
      <img class="thumb" id="attachThumb" style="display:none;">
      <video class="thumb" id="attachThumbVideo" style="display:none;" muted></video>
      <span class="attach-name" id="attachName"></span>
      <button type="button" id="removeAttachBtn">✕</button>
    </div>

    <form id="chatForm">
      <input type="file" id="fileInput" accept="image/*,video/*">
      <button type="button" id="attachBtn" title="Enviar imagem ou vídeo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
      <input type="text" id="messageInput" placeholder="Escreva uma mensagem..." maxlength="500" autocomplete="off">
      <button type="submit" id="sendBtn" title="Enviar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>
  </div>

  <script src="supabaseClient.js"></script>
  <script src="profile-utils.js"></script>
  <script>
    let currentUser = null;
    let currentProfile = null;
    let profilesCache = {};
    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const attachBtn = document.getElementById("attachBtn");
    const fileInput = document.getElementById("fileInput");
    const attachPreview = document.getElementById("attachPreview");
    const attachThumb = document.getElementById("attachThumb");
    const attachThumbVideo = document.getElementById("attachThumbVideo");
    const attachName = document.getElementById("attachName");
    const removeAttachBtn = document.getElementById("removeAttachBtn");

    let selectedFile = null;
    const MAX_IMAGE_MB = 5;
    const MAX_VIDEO_MB = 25;

    function renderMessage(msg) {
      const isOwn = msg.user_id === currentUser.id;
      const div = document.createElement("div");
      div.className = "message" + (isOwn ? " own" : "");
      div.dataset.userId = msg.user_id;
      div.dataset.messageId = msg.id;
      const time = new Date(msg.created_at).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });

      const profile = profilesCache[msg.user_id];
      const displayName = profile?.username || msg.username;
      const displayAvatar = profile ? profile.avatar_url : msg.avatar_url;

      const mediaHtml = msg.media_type === "image"
        ? `<img class="media" src="${msg.media_url}">`
        : msg.media_type === "video"
        ? `<video class="media" src="${msg.media_url}" controls></video>`
        : "";

      const textHtml = msg.content ? `<div class="bubble-text">${escapeHtml(msg.content)}</div>` : "";

      const deleteBtnHtml = isOwn
        ? `<button type="button" class="delete-btn" title="Excluir">
             <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
           </button>`
        : "";

      div.innerHTML = `
        ${avatarHtml(displayAvatar, displayName)}
        <div>
          <div class="meta"><span class="name">${escapeHtml(displayName)}</span> · ${time}${deleteBtnHtml}</div>
          <div class="bubble">${mediaHtml}${textHtml}</div>
        </div>
      `;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      if (isOwn) {
        div.querySelector(".delete-btn").addEventListener("click", () => deleteMessage(msg));
      }
    }

    function avatarHtml(url, name) {
      return url
        ? `<img class="msg-avatar" src="${url}">`
        : `<div class="msg-avatar">${escapeHtml((name || "?").charAt(0).toUpperCase())}</div>`;
    }

    // Atualiza nick/avatar em todas as mensagens já renderizadas desse usuário
    function updateMessagesForUser(userId, profile) {
      document.querySelectorAll(`.message[data-user-id="${userId}"]`).forEach((el) => {
        el.querySelector(".name").textContent = profile.username;
        const avatarEl = el.querySelector(".msg-avatar");
        const newAvatarHtml = avatarHtml(profile.avatar_url, profile.username);
        avatarEl.outerHTML = newAvatarHtml;
      });
    }

    async function deleteMessage(msg) {
      if (!confirm("Excluir esta mensagem?")) return;

      // Apaga o arquivo do Storage primeiro (se houver)
      if (msg.media_url) {
        const path = msg.media_url.split("/chat-media/")[1];
        if (path) await client.storage.from("chat-media").remove([path]);
      }

      const { error } = await client.from("messages").delete().eq("id", msg.id);

      // A remoção visual acontece via realtime (evento DELETE), mas removo
      // na hora também pra não esperar o round-trip caso o realtime demore.
      if (!error) {
        const el = document.querySelector(`.message[data-message-id="${msg.id}"]`);
        if (el) el.remove();
      } else {
        alert("Erro ao excluir: " + error.message);
      }
    }

    function updateSendBtnVisibility() {
      const hasContent = input.value.trim().length > 0 || selectedFile !== null;
      sendBtn.classList.toggle("visible", hasContent);
    }

    input.addEventListener("input", updateSendBtnVisibility);

    attachBtn.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", () => {
      const file = fileInput.files[0];
      if (!file) return;

      const isImage = file.type.startsWith("image/");
      const isVideo = file.type.startsWith("video/");

      if (!isImage && !isVideo) {
        alert("Só é possível enviar imagens ou vídeos.");
        fileInput.value = "";
        return;
      }

      const limitMb = isImage ? MAX_IMAGE_MB : MAX_VIDEO_MB;
      if (file.size > limitMb * 1024 * 1024) {
        alert(`Arquivo muito grande. Limite: ${limitMb}MB.`);
        fileInput.value = "";
        return;
      }

      selectedFile = file;
      attachName.textContent = file.name;
      attachPreview.classList.add("visible");

      const url = URL.createObjectURL(file);
      if (isImage) {
        attachThumb.src = url;
        attachThumb.style.display = "block";
        attachThumbVideo.style.display = "none";
      } else {
        attachThumbVideo.src = url;
        attachThumbVideo.style.display = "block";
        attachThumb.style.display = "none";
      }

      updateSendBtnVisibility();
    });

    removeAttachBtn.addEventListener("click", () => {
      selectedFile = null;
      fileInput.value = "";
      attachPreview.classList.remove("visible");
      attachThumb.style.display = "none";
      attachThumbVideo.style.display = "none";
      updateSendBtnVisibility();
    });

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    async function init() {
      const session = await requireAuth();
      if (!session) return;
      currentUser = session.user;

      currentProfile = await ensureProfile(currentUser);
      applyUserBackground(currentProfile);

      // Carrega todos os perfis pra já exibir os nicks/avatars atuais
      const { data: allProfiles } = await client.from("profiles").select("*");
      if (allProfiles) {
        allProfiles.forEach((p) => { profilesCache[p.id] = p; });
      }

      // Carrega histórico (últimas 50 mensagens)
      const { data: history, error } = await client
        .from("messages")
        .select("*")
        .order("created_at", { ascending: true })
        .limit(50);

      if (!error && history) history.forEach(renderMessage);

      // Assina novas mensagens em tempo real
      client
        .channel("public:messages")
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, (payload) => {
          renderMessage(payload.new);
        })
        .on("postgres_changes", { event: "DELETE", schema: "public", table: "messages" }, (payload) => {
          const el = document.querySelector(`.message[data-message-id="${payload.old.id}"]`);
          if (el) el.remove();
        })
        .subscribe();

      // Assina mudanças de perfil (nick/avatar) em tempo real
      client
        .channel("public:profiles")
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "profiles" }, (payload) => {
          profilesCache[payload.new.id] = payload.new;
          updateMessagesForUser(payload.new.id, payload.new);
          if (payload.new.id === currentUser.id) currentProfile = payload.new;
        })
        .subscribe();
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const content = input.value.trim();
      if (!content && !selectedFile) return;

      sendBtn.disabled = true;

      let mediaUrl = null;
      let mediaType = null;

      if (selectedFile) {
        const ext = selectedFile.name.split(".").pop();
        const path = `${currentUser.id}/${Date.now()}.${ext}`;

        const { error: uploadError } = await client.storage
          .from("chat-media")
          .upload(path, selectedFile);

        if (uploadError) {
          alert("Erro ao enviar arquivo: " + uploadError.message);
          sendBtn.disabled = false;
          return;
        }

        const { data: publicData } = client.storage.from("chat-media").getPublicUrl(path);
        mediaUrl = publicData.publicUrl;
        mediaType = selectedFile.type.startsWith("image/") ? "image" : "video";
      }

      const { error } = await client.from("messages").insert({
        user_id: currentUser.id,
        username: currentProfile.username,
        avatar_url: currentProfile.avatar_url,
        content: content || null,
        media_url: mediaUrl,
        media_type: mediaType
      });

      sendBtn.disabled = false;

      if (!error) {
        input.value = "";
        selectedFile = null;
        fileInput.value = "";
        attachPreview.classList.remove("visible");
        attachThumb.style.display = "none";
        attachThumbVideo.style.display = "none";
        updateSendBtnVisibility();
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await client.auth.signOut();
      window.location.href = "login.html";
    });

    init();
  </script>
</body>
</html>
